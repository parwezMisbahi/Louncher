name: Build Focusly APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then echo "Repo ke root mein koi .zip file nahi mili"; exit 1; fi
          echo "Unzipping: $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          SETTINGS=$(find _src -name "settings.gradle.kts" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts zip ke andar nahi mili"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Focusly-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
