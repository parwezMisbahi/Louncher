name: Build Focusly APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find project (zip ya normal files)
        run: |
          set -e
          echo "Repo ki files:"; ls -la
          ZIP=$(find . -maxdepth 3 -iname "*.zip" -not -path "./_src/*" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Unzipping: $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            SEARCH=_src
          else
            echo "Zip nahi mili, repo ki seedhi files use kar raha hoon"
            SEARCH=.
          fi
          SETTINGS=$(find "$SEARCH" -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "ERROR: settings.gradle.kts kahin nahi mili"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV
          echo "Project folder: $(dirname "$SETTINGS")"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalled) - licenses + platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Focusly-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
